name: Release

# Push a tag and this builds both installers and their hashes, then creates a
# draft release for a maintainer to inspect and publish:
#
#     git push origin main
#     git tag -a v0.2.0 -m "Kara 0.2.0"
#     git push origin v0.2.0
#
# Run it by hand to check a build without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Configure this secret with a provider command containing {file}; the
      # build replaces it with each binary and Inno Setup replaces it with $f.
      # Keep certificates and provider credentials outside this repository.
      KARA_SIGN_COMMAND: ${{ secrets.KARA_SIGN_COMMAND }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # stamp_docs.py reads page commit dates for the sitemap

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # requirements-gpu.txt includes requirements.txt and adds the CUDA
      # wheels. Installing them before both builds is safe: the processor build
      # excludes the nvidia package by name in kara.spec, so what is installed
      # in the environment does not decide what ends up in the file.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gpu.txt pyinstaller pytest

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $src = Get-Content kara.py -Raw
          $ver = [regex]::Match($src, '(?m)^__version__ = "(.+)"').Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -ne $tag) {
            throw "tag $tag does not match __version__ $ver"
          }
          Write-Host "version $ver"

      # Before the build, so no installer exists yet and stamp_docs leaves the
      # size alone. What it does check is everything derived from __version__,
      # which is the part that actually rotted: the JSON-LD sat three releases
      # behind because nothing connected it to the source.
      - name: Check the docs quote this version
        run: python tools/stamp_docs.py --check

      - name: Build CPU and NVIDIA installers
        run: python packaging/build.py

      - name: Run tests
        run: python -m pytest -q

      - name: Verify clean install and edition migration
        shell: pwsh
        run: |
          $cpu = Get-Item dist/Kara-Setup-*.exe | Where-Object Name -notmatch '-GPU-'
          $gpu = Get-Item dist/Kara-Setup-GPU-*.exe
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Kara'
          foreach ($installer in @($cpu, $gpu, $cpu)) {
            Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
            if (-not (Test-Path (Join-Path $app 'Kara.exe'))) { throw "Kara was not installed" }
            $hasNvidia = Test-Path (Join-Path $app '_internal\nvidia')
            if (($installer.Name -match '-GPU-') -ne $hasNvidia) {
              throw "$($installer.Name) left the wrong NVIDIA payload"
            }
          }

      - name: Stamp both sizes into the docs
        run: python tools/stamp_docs.py

      - name: Verify release signatures
        if: startsWith(github.ref, 'refs/tags/') && env.KARA_SIGN_COMMAND != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem dist/Kara/Kara.exe, dist/Kara-Setup-*.exe
          foreach ($file in $signed) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne 'Valid') {
              throw "$($file.Name) has invalid signature status: $($signature.Status)"
            }
          }

      # The size is a different matter. It is only knowable after a build, and
      # this build is not the maintainer's -- a different dependency resolution
      # here weighs a few MB more or less, so an exact match is not something to
      # hold a release hostage to. Reported, not enforced.
      - name: Report any drift in the size the docs quote
        if: always()
        shell: pwsh
        run: |
          $dirty = git status --porcelain -- README.md docs
          if ($dirty) {
            Write-Host "::warning::the docs quote a different installer size than this build produced"
            git --no-pager diff -- README.md docs
          } else {
            Write-Host "docs match this build exactly"
          }

      - name: Keep the build even when nothing is published
        uses: actions/upload-artifact@v4
        with:
          name: Kara
          path: |
            dist/Kara-Setup-*.exe
            dist/SHA256SUMS*.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            (Get-Item dist/Kara-Setup*.exe).FullName
            (Get-Item dist/SHA256SUMS*.txt).FullName
          ) | Sort-Object -Unique
          # Notes come from CHANGELOG.md rather than --generate-notes, which
          # lists merged pull requests and, this project having none, produced a
          # release body containing nothing but a link to the diff. This exits
          # non-zero if the tag has no section, so a release cannot go out
          # saying nothing about itself.
          python tools/release_notes.py $tag --out notes.md
          if ($LASTEXITCODE -ne 0) { throw "no CHANGELOG section for $tag" }

          # The release may already exist: creating the tag through the web or
          # the gh CLI publishes one and then triggers this workflow.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "release $tag already exists; versioned assets are immutable"
          } else {
            gh release create $tag @files --title "Kara $tag" --notes-file notes.md --draft
          }
